services:
  lims:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LIMS_ENV: production
      LIMS_ENABLE_SYNC: "false"
      LIMS_DATA_DIR: /var/lib/lims
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - lims_data:/var/lib/lims
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  lims_data:
